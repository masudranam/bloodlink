spring:
  application:
    name: bloodlink

  datasource:
    url: ${BLOODLINK_DB_URL:jdbc:postgresql://localhost:5433/bloodlink}
    username: ${BLOODLINK_DB_USER:bloodlink}
    password: ${BLOODLINK_DB_PASSWORD:bloodlink}

  jpa:
    # Non-negotiable: the schema is owned by Flyway, never by Hibernate.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${BLOODLINK_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

bloodlink:
  security:
    jwt:
      # Development placeholder only, and not a secret in any meaningful sense:
      # it is in the repository. Anything real must set BLOODLINK_JWT_SECRET.
      # HS256 needs at least 32 bytes.
      secret: ${BLOODLINK_JWT_SECRET:dev-only-insecure-bloodlink-signing-key-change-me}
      # Twelve hours: there is no refresh token, so this is how long a session
      # lasts. Shorter means logging in mid-task; longer widens the window on a
      # stolen token.
      ttl: PT12H

  expiry:
    # A request past its date leaves the feed without anybody remembering to do
    # it. Off means the job bean is never created, so nothing is scheduled
    # rather than scheduled and skipped.
    enabled: ${BLOODLINK_EXPIRY_ENABLED:true}
    # Six-field Spring cron: five past every hour. Config-driven so the cadence
    # can change without a deployment.
    cron: ${BLOODLINK_EXPIRY_CRON:0 5 * * * *}

  eligibility:
    # Pillar 2: eligibility is COMPUTED from this interval, never stored.
    donation-interval-days: 90
    # Eligibility is a question about the donor's calendar day, not the server's.
    # A server running in UTC would call a Dhaka donor eligible six hours late.
    zone: Asia/Dhaka

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.flywaydb: INFO
    # Every log line carries the correlation id from CorrelationIdFilter. See
    # logback-spring.xml for the pattern; there is deliberately no scrubbing
    # layer, because nothing logs a phone number in the first place.
    com.bloodlink: ${BLOODLINK_LOG_LEVEL:INFO}
