spring:
  application:
    name: roktolink

  datasource:
    url: ${ROKTOLINK_DB_URL:jdbc:postgresql://localhost:5433/roktolink}
    username: ${ROKTOLINK_DB_USER:roktolink}
    password: ${ROKTOLINK_DB_PASSWORD:roktolink}

  jpa:
    # Non-negotiable: the schema is owned by Flyway, never by Hibernate.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${ROKTOLINK_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

roktolink:
  security:
    jwt:
      # Development placeholder only, and not a secret in any meaningful sense:
      # it is in the repository. Anything real must set ROKTOLINK_JWT_SECRET.
      # HS256 needs at least 32 bytes.
      secret: ${ROKTOLINK_JWT_SECRET:dev-only-insecure-roktolink-signing-key-change-me}
      # Twelve hours: there is no refresh token, so this is how long a session
      # lasts. Shorter means logging in mid-task; longer widens the window on a
      # stolen token.
      ttl: PT12H

  eligibility:
    # Pillar 2: eligibility is COMPUTED from this interval, never stored.
    donation-interval-days: 90
    # Eligibility is a question about the donor's calendar day, not the server's.
    # A server running in UTC would call a Dhaka donor eligible six hours late.
    zone: Asia/Dhaka

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    org.flywaydb: INFO
